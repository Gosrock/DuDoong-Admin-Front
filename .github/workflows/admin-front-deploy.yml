name: Build & Docker Push - Admin Front
on:
  push:
    tags:
      - AdminFront-v*.*.*
  # 이미 배포된 버전을 같은 소스로 다시 빌드(예: 멀티 아키 재빌드)할 때 사용
  workflow_dispatch:
    inputs:
      ref:
        description: '빌드할 git 태그 (예: AdminFront-v0.6.0)'
        required: true
        type: string
      version:
        description: '이미지 태그 버전 (비우면 ref 에서 추출, 예: 0.6.0). 지정하면 ref 의 버전과 같아야 한다'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 빌드할 태그와 이미지 버전을 먼저 확정한다.
      # 수동 실행 시 ref 는 AdminFront-vX.Y.Z 태그만 허용하고 refs/tags/ 로 고정해 브랜치·포크 PR ref(refs/pull/...) 빌드를 막는다.
      # version 은 ref 에서 뽑은 버전과 같아야 한다 (다른 버전 이미지 태그 덮어쓰기 방지).
      - name: Get the version
        id: get_version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_REF"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          TAG_RE='^AdminFront-v([0-9]+\.[0-9]+\.[0-9]+)$'
          if ! [[ "$TAG" =~ $TAG_RE ]]; then
            echo "잘못된 태그 형식(AdminFront-vX.Y.Z 필요): $TAG" >&2
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          if [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "$VERSION" ]; then
            echo "version($INPUT_VERSION)이 ref 의 버전($VERSION)과 다름" >&2
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "잘못된 버전 형식: $VERSION" >&2
            exit 1
          fi
          echo "REF=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.get_version.outputs.REF }}
          fetch-depth: 0
          persist-credentials: false

      # 수동 재빌드 시 소스는 지정한 태그 그대로 쓰고, Dockerfile 만 이 워크플로가 실행된 커밋의 것으로 교체한다.
      # (구버전 태그의 Dockerfile 에는 --platform=$BUILDPLATFORM 이 없어 arm64 빌드가 QEMU 로 느리게 돌기 때문)
      - name: Use Dockerfile from workflow commit
        if: github.event_name == 'workflow_dispatch'
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: git checkout "$WORKFLOW_SHA" -- Dockerfile

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: BUILD_MODE=production
          tags: water0641/dudoong-internal-admin:${{ steps.get_version.outputs.VERSION }}
